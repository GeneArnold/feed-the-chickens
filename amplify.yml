# Amplify Hosting: every push to main publishes the game. There is no real build; this copies the
# game's files into dist/ (leaving out tools/ and docs) and stamps the commit into the
# offline cache version in sw.js, so installed phones fetch the new release on their next visit.
version: 1
frontend:
  phases:
    build:
      commands:
        - mkdir -p dist
        - cp -r index.html style.css manifest.webmanifest sw.js vendor js sayings icons dist/
        - rm -rf dist/sayings/voice-samples
        - sed -i "s/chickens-dev/chickens-$(echo "$AWS_COMMIT_ID" | cut -c1-12)/" dist/sw.js
        - grep -q 'chickens-dev' dist/sw.js && echo "sw.js VERSION was not stamped" && exit 1 || true
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  customHeaders:
    # Phones must always check for a new service worker, or a release never reaches them.
    - pattern: "sw.js"
      headers:
        - key: Cache-Control
          value: no-cache
